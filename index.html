<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#071426">
    <title>Smart List</title>
    <script>
        (() => {
            const autenticado = Boolean(
                sessionStorage.getItem("accessToken")
                || localStorage.getItem("accessToken")
            );

            if (autenticado) {
                let destino = "./dashboard.html";
                try {
                    const usuario = JSON.parse(localStorage.getItem("usuarioAtual") || "null");
                    if (String(usuario?.perfil || "").toUpperCase() === "ADMIN") {
                        destino = "./admin/index.html";
                    }
                } catch (_erro) {}
                location.replace(destino);
                return;
            }

            const concluido =
                localStorage.getItem("smartlist_onboarding_completed") === "true";

            location.replace(
                concluido ? "./login.html" : "./onboarding.html"
            );
        })();
    </script>
</head>
<body>
    <noscript>
        <p>Ative o JavaScript para acessar o Smart List.</p>
        <a href="./login.html">Ir para o login</a>
    </noscript>
</body>
</html>
