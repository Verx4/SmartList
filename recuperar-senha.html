<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <meta name="application-name" content="Minha Lista">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./css/pwa.css">
    <script type="module" src="./js/pwa.js"></script>

    <title>Recuperar Senha | Minha Lista</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/buttons.css">
    <link rel="stylesheet" href="./css/forms.css">
    <link rel="stylesheet" href="./css/auth.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body class="auth-body">

    <main class="auth-container auth-container-centralizado">

        <section class="auth-card card">

            <a class="brand" href="./index.html">🛒 Minha Lista</a>

            <div class="auth-card-header">
                <span class="page-eyebrow">Recuperação</span>
                <h1>Esqueceu sua senha?</h1>

                <p>
                    Informe o e-mail da sua conta para receber as instruções
                    de recuperação.
                </p>
            </div>

            <form id="formRecuperarSenha" class="form" novalidate>

                <div class="form-group">
                    <label for="recuperarEmail">E-mail</label>
                    <input
                        type="email"
                        id="recuperarEmail"
                        name="email"
                        placeholder="seuemail@exemplo.com"
                        autocomplete="email"
                        required>
                </div>

                <button class="btn btn-primary btn-block" type="submit">
                    Enviar instruções
                </button>

                <div
                    id="mensagemAuth"
                    class="mensagem"
                    aria-live="polite">
                </div>

            </form>

            <p class="auth-link">
                Lembrou sua senha?
                <a href="./login.html">Voltar ao login</a>
            </p>

        </section>

    </main>

    <script type="module" src="./js/auth-page.js"></script>

</body>

</html>
