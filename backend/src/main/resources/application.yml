spring:
  application:
    name: smart-list-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/minha_lista}
    username: ${DB_USERNAME:minha_lista}
    password: ${DB_PASSWORD:minha_lista_dev}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration/{vendor}
  jackson:
    time-zone: America/Fortaleza
  mail:
    host: ${EMAIL_HOST:smtp.gmail.com}
    port: ${EMAIL_PORT:587}
    username: "${EMAIL_USER:}"
    password: "${EMAIL_PASSWORD:}"
    test-connection: false
    properties:
      "[mail.smtp.auth]": ${EMAIL_SMTP_AUTH:true}
      "[mail.smtp.starttls.enable]": ${EMAIL_STARTTLS:true}
      "[mail.smtp.ssl.enable]": ${EMAIL_SSL_ENABLE:false}
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 10000
      "[mail.smtp.writetimeout]": 10000
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  expor-erros: ${EXPOSE_ERROR_DETAILS:false}
  jwt:
    secret: ${JWT_SECRET}
    expiracao-minutos: ${JWT_EXPIRATION_MINUTES:120}
  frontend-url: ${FRONTEND_URL:http://127.0.0.1:5500}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:http://127.0.0.1:5500}}
  password-reset:
    email-enabled: ${MAIL_ENABLED:false}
    email-from: "${EMAIL_FROM:}"
    pepper: "${PASSWORD_RESET_PEPPER:${JWT_SECRET}}"
    codigo-expiracao-minutos: ${PASSWORD_RESET_CODE_EXPIRATION_MINUTES:10}
    max-tentativas-codigo: ${PASSWORD_RESET_MAX_ATTEMPTS:5}
    max-solicitacoes-por-email: ${PASSWORD_RESET_MAX_EMAIL_REQUESTS:3}
    max-solicitacoes-por-ip: ${PASSWORD_RESET_MAX_IP_REQUESTS:10}
    janela-solicitacoes-minutos: ${PASSWORD_RESET_REQUEST_WINDOW_MINUTES:30}
    intervalo-reenvio-segundos: ${PASSWORD_RESET_RESEND_SECONDS:60}
    max-falhas-alteracao-senha: ${PASSWORD_CHANGE_MAX_FAILURES:5}
    janela-alteracao-senha-minutos: ${PASSWORD_CHANGE_WINDOW_MINUTES:15}
  admin:
    nome: ${ADMIN_NOME:Administrador}
    email: ${ADMIN_EMAIL:}
    senha: ${ADMIN_PASSWORD:}
  mercado-pago:
    environment: ${MERCADO_PAGO_ENVIRONMENT:production}
    access-token: ${MERCADO_PAGO_ACCESS_TOKEN:${MERCADO_PAGO_TOKEN:}}
    webhook-url: ${MERCADO_PAGO_WEBHOOK_URL:}
    webhook-secret: ${MERCADO_PAGO_WEBHOOK_SECRET:}
    webhook-tolerancia-minutos: ${MERCADO_PAGO_WEBHOOK_TOLERANCE_MINUTES:5}
  scraper:
    margem-percentual: 5.00
  ofertas:
    captura-ativa: ${OFFER_CAPTURE_ENABLED:true}
    tamanho-maximo-bytes: ${OFFER_MAX_DOWNLOAD_BYTES:15728640}
    paginas-maximas-pdf: ${OFFER_MAX_PDF_PAGES:12}
    google-vision-api-key: ${GOOGLE_CLOUD_VISION_API_KEY:}
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_OFFER_MODEL:gpt-5-nano}

  voz:
    openai-api-key: ${OPENAI_API_KEY:}
    openai-model: ${OPENAI_TRANSCRIPTION_MODEL:gpt-4o-mini-transcribe}

logging:
  level:
    org.springframework.security: INFO




app.kiwify:
  client-id: ${KIWIFY_CLIENT_ID:}
  client-secret: ${KIWIFY_CLIENT_SECRET:}
  account-id: ${KIWIFY_ACCOUNT_ID:}
  checkout:
    mensal: ${KIWIFY_CHECKOUT_MENSAL:https://pay.kiwify.com.br/CsdUxeJ}
    trimestral: ${KIWIFY_CHECKOUT_TRIMESTRAL:https://pay.kiwify.com.br/sd2O7Hi}
    anual: ${KIWIFY_CHECKOUT_ANUAL:https://pay.kiwify.com.br/FOP3RIc}
