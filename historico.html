
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <title>Histórico | Smart List</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/mobile-app.css">
    <link rel="stylesheet" href="./css/temas.css">
    <link rel="stylesheet" href="./css/historico-v2.css?v=1">
</head>
<body>
    <main class="historico-shell">
        <header class="historico-topo"><a href="./inicio.html"><span>Smart</span> List</a><a href="./menu.html" aria-label="Abrir menu">☰</a></header>
        <section class="historico-cabecalho"><small>Suas compras</small><h1>Histórico</h1><p>Acompanhe para onde o dinheiro foi e toque em uma categoria para ver os itens.</p></section>

        <section class="historico-resumo" aria-label="Resumo do histórico">
            <article><span>Total gasto</span><strong id="historicoTotalGasto">R$ 0,00</strong></article>
            <article><span>Economia</span><strong id="historicoTotalEconomizado">R$ 0,00</strong></article>
            <article><span>Compras</span><strong id="historicoQuantidadeCompras">0</strong></article>
            <article><span>Média</span><strong id="historicoMediaCompra">R$ 0,00</strong></article>
        </section>

        <section class="historico-grafico-card">
            <header><div><small>Distribuição</small><h2>Gastos por categoria</h2></div><span>Toque para detalhar</span></header>
            <div id="graficoCategoriasHistorico" class="grafico-categorias-historico"></div>
        </section>

        <section id="detalheCategoriaHistorico" class="detalhe-categoria-historico" hidden>
            <header><div><small>Categoria selecionada</small><h2 id="nomeCategoriaHistorico"></h2></div><strong id="totalCategoriaHistorico"></strong></header>
            <div id="itensCategoriaHistorico"></div>
        </section>

        <section class="compras-historico-v2">
            <header><div><small>Compras</small><h2>Lista completa</h2></div><div><button id="btnExportarHistorico" type="button">Exportar</button><button id="btnLimparHistorico" type="button">Zerar</button></div></header>
            <label class="busca-historico"><span>Buscar item ou mercado</span><input id="buscarHistorico" type="search" placeholder="Ex.: arroz ou Atacadão"></label>
            <div id="listaHistorico" class="lista-historico-v2"></div>
        </section>
    </main>

    <script src="./js/tema.js"></script>
    <script type="module" src="./js/historico-page.js?v=2"></script>
    <script src="./js/mobile-nav.js"></script>
</body>
</html>
