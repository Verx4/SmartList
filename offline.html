<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <meta name="description" content="Página offline do aplicativo Smart List.">
    <title>Sem conexão | Smart List</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./css/global.css?v=48">
    <link rel="stylesheet" href="./css/buttons.css">
    <link rel="stylesheet" href="./css/pwa.css">
    <script type="module" src="./js/pwa.js"></script>
    <style>
        .offline-page {
            display: grid;
            min-height: 100vh;
            padding: 24px;
            place-items: center;
        }

        .offline-card {
            width: min(100%, 520px);
            padding: 36px;
            text-align: center;
            background: #131c2f;
            border: 1px solid #334155;
            border-radius: 24px;
        }

        .offline-icon {
            width: 88px;
            height: 88px;
            margin: 0 auto 22px;
            border-radius: 22px;
        }

        .offline-card p {
            margin: 14px 0 24px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <main class="offline-page">
        <section class="offline-card" aria-labelledby="offline-title">
            <img class="offline-icon" src="./assets/icons/icon-192.png" alt="">
            <h1 id="offline-title">Você está sem conexão</h1>
            <p>As páginas já abertas continuam disponíveis. Reconecte-se para atualizar preços e sincronizar sua lista.</p>
            <button class="btn btn-primary" type="button" onclick="window.location.reload()">
                Tentar novamente
            </button>
        </section>
    </main>
</body>

</html>
