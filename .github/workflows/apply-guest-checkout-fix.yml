name: Aplicar ajuste temporario do checkout convidado

on:
  push:
    branches:
      - fix/mercado-pago-guest-checkout
    paths:
      - ".github/workflows/apply-guest-checkout-fix.yml"

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mercado-pago-guest-checkout
      - name: Remover pre-vinculo do pagador no Checkout Pro
        shell: python
        run: |
          from pathlib import Path
          path = Path("backend/src/main/java/br/com/minhalista/pagamento/MercadoPagoService.java")
          text = path.read_text(encoding="utf-8")
          old = """            Map<String, Object> corpo = montarCorpoPreferencia(usuario, assinatura);\n\n            LOG.info("""
          new = """            Map<String, Object> corpo = montarCorpoPreferencia(usuario, assinatura);\n            // Deixe o Mercado Pago coletar os dados do comprador no próprio Checkout Pro.\n            // Isso preserva o pagamento como convidado e evita vincular o checkout\n            // à sessão/identidade usada no cadastro do Smart List.\n            corpo.remove(\"payer\");\n\n            LOG.info("""
          if old not in text:
              raise SystemExit("Trecho alvo não encontrado; nenhuma alteração aplicada.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit do ajuste
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/main/java/br/com/minhalista/pagamento/MercadoPagoService.java
          git commit -m "Permite Checkout Pro como convidado"
          git push origin HEAD:fix/mercado-pago-guest-checkout
