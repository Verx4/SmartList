<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1220">
    <meta name="application-name" content="Smart List">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
    <link rel="stylesheet" href="./css/pwa.css">
    <script type="module" src="./js/pwa.js"></script>

    <title>Sugestões | Smart List</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/cards.css">
    <link rel="stylesheet" href="./css/buttons.css">
    <link rel="stylesheet" href="./css/forms.css">
    <link rel="stylesheet" href="./css/suporte.css">
    <link rel="stylesheet" href="./css/responsive.css">
</head>

<body class="sem-controle-tema" data-controle-tema="oculto">

    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="./inicio.html">🛒 Smart List</a>

            <nav class="main-nav">
                <a href="./dashboard.html">Minha lista</a>
                <a href="./relatorios.html">Relatórios</a>
                <a href="./sugestoes.html" class="active">Sugestões</a>
                <a href="./suporte.html">Suporte</a>
                <a href="./perfil.html">Perfil</a>
            </nav>
        </div>
    </header>

    <main class="container page-main">

        <section class="page-header">
            <span class="page-eyebrow">Comunidade</span>
            <h1>Caixa de sugestões</h1>
            <p>
                Envie ideias e vote nas melhorias que gostaria de ver.
            </p>
        </section>

        <section class="card">
            <h2>Enviar nova sugestão</h2>

            <form id="formSugestao" class="form" novalidate>

                <div class="form-group">
                    <label for="tituloSugestao">Título</label>
                    <input
                        type="text"
                        id="tituloSugestao"
                        name="titulo"
                        maxlength="100"
                        placeholder="Resuma sua ideia"
                        required>
                </div>

                <div class="form-group">
                    <label for="categoriaSugestao">Categoria</label>
                    <select
                        id="categoriaSugestao"
                        name="categoria"
                        required>
                        <option value="">Selecione</option>
                        <option value="lista">Lista de compras</option>
                        <option value="precos">Preços e comparação</option>
                        <option value="relatorios">Relatórios</option>
                        <option value="notificacoes">Notificações</option>
                        <option value="acessibilidade">Acessibilidade</option>
                        <option value="outros">Outros</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="descricaoSugestao">Descrição</label>
                    <textarea
                        id="descricaoSugestao"
                        name="descricao"
                        rows="5"
                        maxlength="1000"
                        placeholder="Explique como sua sugestão funcionaria"
                        required></textarea>
                </div>

                <button class="btn btn-primary" type="submit">
                    Enviar sugestão
                </button>

                <div
                    id="mensagemSugestao"
                    class="mensagem"
                    aria-live="polite">
                </div>

            </form>
        </section>

    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <p>© 2026 Smart List</p>

            <nav class="footer-links">
                <a href="./termos.html">Termos</a>
                <a href="./privacidade.html">Privacidade</a>
                <a href="./suporte.html">Suporte</a>
            </nav>
        </div>
    </footer>

    <script type="module" src="./js/sugestoes.js"></script>

</body>

</html>
