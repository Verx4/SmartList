services:
  - type: web
    name: smart-list-backend
    runtime: docker
    rootDir: backend
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://smart-list-app.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-list-app.onrender.com,https://minha-lista-app.vercel.app
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_URL
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
