services:
  - type: web
    name: smart-list-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: virginia
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - backend/**
        - data/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://smart-list-app.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-list-app.onrender.com,https://minha-lista-app.vercel.app
      - key: THEMEALDB_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
