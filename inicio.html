<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07182d">
    <title>Início | Smart List</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./css/global.css?v=50">
    <link rel="stylesheet" href="./css/mobile-app.css">
    <link rel="stylesheet" href="./css/inicio.css?v=1">
    <link rel="stylesheet" href="./css/temas.css">
</head>
<body>
    <main class="app-shell inicio-shell">
        <header class="app-topbar inicio-topbar">
            <a class="app-brand inicio-marca" href="./inicio.html">
                <img src="./assets/logo/smart-list-app.png" alt="" aria-hidden="true">
                <span><span class="smart">Smart</span> <span class="list">List</span></span>
            </a>
            <div class="inicio-topbar-acoes">
                <button id="btnTemaInicio" type="button" aria-label="Abrir opções de tema" title="Temas">🎨</button>
            </div>
        </header>

        <section class="inicio-saudacao">
            <div><small>Resumo de hoje</small><h1 id="saudacaoInicio">Olá! 👋</h1></div>
            <a class="inicio-lista-atalho" href="./dashboard.html">Abrir lista <span>→</span></a>
        </section>

        <section class="inicio-destaque" aria-label="Resumo mensal" data-premium-content>
            <div class="inicio-destaque-topo"><span>Gasto neste mês</span><small id="mesReferencia"></small></div>
            <strong id="gastoMes">R$ 0,00</strong>
            <div class="inicio-destaque-rodape"><span id="variacaoMes" class="inicio-variacao neutra">Sem compras registradas</span><span id="mediaCompra">Média R$ 0,00</span></div>
        </section>

        <section class="inicio-metricas" aria-label="Indicadores das compras" data-premium-content>
            <article><span>Compras no mês</span><strong id="comprasMes">0</strong></article>
            <article><span>Economia no mês</span><strong id="economiaMes">R$ 0,00</strong></article>
            <article><span>Itens na lista</span><strong id="itensLista">0</strong></article>
        </section>

        <section class="inicio-painel" data-premium-content>
            <header><div><small>Este mês</small><h2>Gastos por categoria</h2></div><a href="./historico.html">Ver detalhes</a></header>
            <div id="graficoGastos" class="inicio-grafico" aria-label="Gráfico de gastos por categoria"></div>
            <div class="inicio-insights">
                <div><span>Categoria principal</span><strong id="categoriaPrincipal">Sem dados</strong></div>
                <div><span>Última compra</span><strong id="ultimaCompraInicio">—</strong></div>
            </div>
        </section>

        <section class="inicio-acoes" aria-label="Ações rápidas">
            <a href="./dashboard.html">＋ Adicionar itens</a>
            <a href="./minha-economia.html">Minha Economia</a>
        </section>
    </main>

    <script src="./js/tema.js?v=11"></script>
    <script src="./js/acesso-premium.js?v=4"></script>
    <script type="module" src="./js/inicio.js?v=3"></script>
    <script src="./js/admin-return.js"></script>
    <script src="./js/mobile-nav.js?v=4"></script>
</body>
</html>
