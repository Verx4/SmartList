<!DOCTYPE html>
<html lang="pt-BR" class="onboarding-checking">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#071426">
    <meta name="application-name" content="Smart List">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./assets/icons/icon-192.png" type="image/png">
    <title>Conheça o Smart List</title>
    <script>
        (() => {
            const concluido = localStorage.getItem("smartlist_onboarding_completed") === "true";
            const autenticado = Boolean(
                sessionStorage.getItem("accessToken")
                || localStorage.getItem("accessToken")
            );

            if (autenticado) {
                let destino = "./dashboard.html";
                try {
                    const usuario = JSON.parse(localStorage.getItem("usuarioAtual") || "null");
                    if (String(usuario?.perfil || "").toUpperCase() === "ADMIN") {
                        destino = "./admin/index.html";
                    }
                } catch (_erro) {}
                location.replace(destino);
                return;
            }

            if (concluido) {
                location.replace("./login.html");
                return;
            }

            document.documentElement.classList.remove("onboarding-checking");
        })();
    </script>
    <link rel="stylesheet" href="./css/onboarding.css?v=1">
</head>
<body>
    <main class="onboarding" aria-label="Apresentação do Smart List">
        <header class="onboarding-topo">
            <img src="./assets/logo/smart-list-app.png" alt="Smart List" width="38" height="38">
            <button id="pularOnboarding" class="onboarding-pular" type="button">Pular</button>
        </header>

        <section id="onboardingSlides" class="onboarding-slides" aria-live="polite">
            <article class="onboarding-slide ativo" data-slide="0" aria-hidden="false">
                <h1 class="sr-only">Chega de calculadora no mercado</h1>
                <img src="./assets/onboarding/onboarding-1.svg" alt="Chega de calculadora no mercado. O Smart List soma automaticamente sua compra enquanto você adiciona os itens.">
            </article>
            <article class="onboarding-slide" data-slide="1" aria-hidden="true">
                <h2 class="sr-only">Acompanhe seus gastos por categoria</h2>
                <img src="./assets/onboarding/onboarding-2.svg" alt="Acompanhe seus gastos por categoria e visualize seu histórico para comprar com mais inteligência." loading="lazy">
            </article>
            <article class="onboarding-slide" data-slide="2" aria-hidden="true">
                <h2 class="sr-only">Compare embalagens</h2>
                <img src="./assets/onboarding/onboarding-3.svg" alt="Compare diferentes tamanhos e preços para descobrir qual embalagem vale mais a pena." loading="lazy">
            </article>
        </section>

        <footer class="onboarding-controles">
            <div id="indicadoresOnboarding" class="onboarding-indicadores" aria-label="Progresso da apresentação">
                <button class="ativo" type="button" aria-label="Ir para a tela 1" aria-current="step"></button>
                <button type="button" aria-label="Ir para a tela 2"></button>
                <button type="button" aria-label="Ir para a tela 3"></button>
            </div>
            <div class="onboarding-acoes">
                <button id="voltarOnboarding" class="onboarding-botao secundario" type="button" hidden>Voltar</button>
                <button id="avancarOnboarding" class="onboarding-botao principal" type="button">Começar</button>
            </div>
        </footer>
    </main>
    <script src="./js/onboarding.js?v=1" defer></script>
</body>
</html>
