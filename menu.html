<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07182d">
    <title>Menu | Smart List</title>
    <link rel="stylesheet" href="./css/global.css?v=50">
    <link rel="stylesheet" href="./css/mobile-app.css">
    <link rel="stylesheet" href="./css/temas.css">
    <link rel="stylesheet" href="./css/sugestoes-notificacoes.css?v=1">
</head>
<body>
    <main class="app-shell">
        <header class="app-topbar">
            <div class="app-brand">
                <span class="smart">Smart</span> <span class="list">List</span>
            </div>
        </header>

        <section class="menu-card">
            <h1 id="nomeMenu">Usuário</h1>
            <p id="emailMenu">Sua conta Smart List</p>
        </section>

        <section class="menu-list" aria-label="Opções da conta">
            <a href="./minha-economia.html"><span>Minha Economia</span><b>›</b></a>
            <a href="./despensa.html"><span>🏠 Minha Despensa</span><b>›</b></a>
            <a href="./perfil.html"><span>👤 Perfil</span><b>›</b></a>
            <a href="./assinatura.html"><span>👑 Escolha seu plano</span><b>›</b></a>
            <a href="./sugestoes.html" class="link-sugestoes-notificacao" data-sugestoes-link>
                <span>💬 Sugestões e feedback <i class="badge-sugestoes" data-badge-sugestoes hidden></i></span><b>›</b>
            </a>
            <a href="./modo-de-usar.html"><span>📘 Modo de usar</span><b>›</b></a>
            <a href="./termos.html"><span>📄 Termos de uso</span><b>›</b></a>
            <a href="./privacidade.html"><span>🔒 Política de privacidade</span><b>›</b></a>
            <a href="./configuracoes.html"><span>⚙️ Configurações</span><b>›</b></a>

            <button id="btnLimparTodosDados" class="danger" type="button">
                <span>🗑️ LIMPAR TODOS OS DADOS</span><b>›</b>
            </button>

            <button id="sairConta" class="danger" type="button">
                <span>↪ Sair da conta</span><b>›</b>
            </button>
        </section>
    </main>

    <script>
        try {
            const usuario = JSON.parse(
                localStorage.getItem("usuarioAtual")
                || localStorage.getItem("usuarioLogado")
                || "{}"
            );
            document.getElementById("nomeMenu").textContent =
                usuario.nome || usuario.name || "Usuário";
            document.getElementById("emailMenu").textContent =
                usuario.email || "Sua conta Smart List";
        } catch {
            // Mantém os textos padrão.
        }

        document.getElementById("sairConta").onclick = () => {
            localStorage.removeItem("usuarioAtual");
            localStorage.removeItem("usuarioLogado");
            location.href = "./login.html";
        };
    </script>
    <script type="module" src="./js/menu.js?v=1"></script>
    <script type="module" src="./js/animations.js"></script>
    <script type="module" src="./js/sugestoes-badge.js?v=1"></script>
    <script src="./js/tema.js?v=11"></script>
    <script src="./js/mobile-nav.js?v=4"></script>
</body>
</html>
