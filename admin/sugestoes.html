<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b1220">
    <meta name="application-name" content="Smart List">
    <link rel="manifest" href="../manifest.webmanifest">
    <link rel="icon" href="../assets/icons/icon-192.png" type="image/png">
    <link rel="stylesheet" href="../css/pwa.css">
    <script type="module" src="../js/pwa.js"></script>
    <title>Sugestões e feedback | Administração</title>
    <link rel="stylesheet" href="../css/global.css?v=48">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/cards.css">
    <link rel="stylesheet" href="../css/buttons.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/admin.css?v=4">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/temas.css">
</head>
<body data-admin-page="sugestoes">
    <div class="admin-layout">
        <aside class="admin-sidebar">
            <a class="brand admin-brand" href="./index.html"><img class="brand-logo" src="../assets/logo/smart-list-app.png" alt="" width="38" height="38"><span>Smart List</span></a>
            <nav class="admin-nav" aria-label="Administração"></nav>
        </aside>

        <main class="admin-main">
            <header class="admin-header">
                <div>
                    <span class="page-eyebrow">Atendimento</span>
                    <h1>Sugestões e feedback</h1>
                    <p>Responda dúvidas, acompanhe ideias e gerencie as mensagens dos usuários.</p>
                </div>
                <div class="admin-header-acoes">
                    <a class="btn btn-primary" href="../sugestoes.html">Abrir área do usuário</a>
                </div>
            </header>

            <section class="grid-resumo">
                <article class="card resumo-card">
                    <span>Total</span>
                    <strong id="totalSugestoes">0</strong>
                </article>
                <article class="card resumo-card">
                    <span>Novas</span>
                    <strong id="sugestoesNovas">0</strong>
                </article>
                <article class="card resumo-card">
                    <span>Em análise</span>
                    <strong id="sugestoesAnalise">0</strong>
                </article>
                <article class="card resumo-card">
                    <span>Concluídas</span>
                    <strong id="sugestoesConcluidas">0</strong>
                </article>
            </section>

            <section class="card">
                <div class="form-row">
                    <div class="form-group">
                        <label for="buscarAdminSugestao">Buscar</label>
                        <input
                            type="search"
                            id="buscarAdminSugestao"
                            placeholder="Usuário, título ou mensagem">
                    </div>
                    <div class="form-group">
                        <label for="filtroAdminSugestao">Status</label>
                        <select id="filtroAdminSugestao">
                            <option value="">Todos</option>
                            <option value="NOVA">Novas</option>
                            <option value="EM_ANALISE">Em análise</option>
                            <option value="PLANEJADA">Planejadas</option>
                            <option value="CONCLUIDA">Concluídas</option>
                            <option value="ARQUIVADA">Arquivadas</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="card">
                <div class="section-header">
                    <div>
                        <span class="card-label">Caixa de entrada</span>
                        <h2>Mensagens recebidas</h2>
                    </div>
                </div>
                <div id="listaAdminSugestoes" class="admin-feedback-lista">
                    <p class="estado-vazio">Carregando sugestões...</p>
                </div>
            </section>

            <div id="mensagemAdminSugestoes" class="mensagem" aria-live="polite"></div>
        </main>
    </div>

    <script src="../js/tema.js?v=11"></script>
    <script src="../js/admin-nav.js?v=5"></script>
    <script type="module" src="../js/admin.js"></script>
    <script type="module" src="../js/admin-sugestoes.js"></script>
</body>
</html>
